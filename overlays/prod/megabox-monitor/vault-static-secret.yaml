apiVersion: v1
kind: ServiceAccount
metadata:
  name: megabox-monitor-vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: megabox-monitor-vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator-system/cagea1-vault
  kubernetes:
    role: config-vso
    serviceAccount: megabox-monitor-vault-auth
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: megabox-monitor-fcm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: kv-v2
  mount: kv
  path: megabox-post-alarm-prod-secret
  refreshAfter: 1h
  vaultAuthRef: megabox-monitor-vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: megabox-monitor
  destination:
    create: true
    overwrite: true
    name: megabox-monitor-fcm
    transformation:
      excludeRaw: false
